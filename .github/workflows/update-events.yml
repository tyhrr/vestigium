name: Update upcoming events

# Reads the public Google Calendars and refreshes src/data/upcoming-events.json,
# which the homepage turns into the "Coming up" cards.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install calendar parser
        run: npm ci --ignore-scripts --prefix tools

      - name: Fetch events
        run: node tools/fetch-events.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/upcoming-events.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/upcoming-events.json
          git commit -m "chore(events): refresh upcoming events"
          git push
